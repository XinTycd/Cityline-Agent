[package]
name = "hackson-acceptance"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
argon2 = "0.5"
askama = "0.15"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
calamine = "0.38"
csv = "1"
good_lp = { version = "=1.15.3", default-features = false, features = ["microlp"] }
openidconnect = { version = "4.0", default-features = false, features = ["reqwest", "native-tls"] }
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "9.8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = "1"
