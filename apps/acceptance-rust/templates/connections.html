{% extends "shell.html" %}
{% block content %}
<div class="page-heading"><div><h1>{{ heading }}</h1><p>查看提案所用平台与获取数据的方式。</p></div></div>
<section class="panel">
  <div class="result-header section-toolbar">
    <div><h2>新云平台</h2><p>登录平台后查询公交和地铁覆盖及距离明细。</p></div>
    {% if let Some(url) = cloud %}<a class="button secondary" href="{{ url }}" target="_blank" rel="noopener noreferrer">前往新云平台</a>
    {% else %}<span class="badge">未配置平台地址</span>{% endif %}
  </div>
</section>
<section class="panel">
  <div class="result-header section-toolbar">
    <div><h2>红豆平台</h2><p>登录平台后查询档期库存、可售数量与地铁点位规格。</p></div>
    {% if let Some(url) = red %}<a class="button secondary" href="{{ url }}" target="_blank" rel="noopener noreferrer">前往红豆平台</a>
    {% else %}<span class="badge">未配置平台地址</span>{% endif %}
  </div>
</section>
{% endblock %}
