<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>城线 · {{ heading }}</title>
  <script src="/assets/workspace.js"></script>
  <link rel="icon" href="/assets/cityline.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/workbench.css">
</head>
<body class="workspace-page">
  <a class="skip" href="#main">跳到内容</a>
  <aside class="workspace-sidebar">
    <a class="brand" href="/overview"><img data-site-logo src="/assets/cityline.svg" alt="" width="34" height="34"><span><span data-site-name>城线</span><small data-site-description>{{ crate::settings::DEFAULT_DESCRIPTION }}</small></span></a>
    {# Icon paths from Lucide. See assets/lucide/LICENSE. #}
    <nav id="workspace-nav" aria-label="工作区导航">
      <div class="nav-group" role="group" aria-label="业务工作台">
      <p class="nav-group-title" aria-hidden="true">业务工作台</p>
      <a href="/overview"{% if section == "overview" %} aria-current="page"{% endif %} aria-label="数据总览">
        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path d="M13 17V9M18 17V5M3 3v16a2 2 0 0 0 2 2h16M8 17v-3"/>
        </svg><span class="nav-label">数据总览</span>
      </a>
      <a href="/media-proposals"{% if section == "tasks" %} aria-current="page"{% endif %} aria-label="提案任务">
        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <rect width="8" height="4" x="8" y="2" rx="1"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M12 11h4m-4 5h4M8 11h.01M8 16h.01"/>
        </svg><span class="nav-label">提案任务</span>
      </a>
      <a href="/task-log"{% if section == "task-log" %} aria-current="page"{% endif %} data-optional-column="task-log" aria-label="任务明细">
        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/>
          <path d="M14 2v5a1 1 0 0 0 1 1h5M10 9H8m8 4H8m8 4H8"/>
        </svg><span class="nav-label">任务明细</span>
      </a>
      <a href="/media-data"{% if section == "media-data" %} aria-current="page"{% endif %} data-optional-column="media-data" aria-label="数据中心">
        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/>
        </svg><span class="nav-label">数据中心</span>
      </a>
      </div>
      <div class="nav-group" role="group" aria-label="管理设置" data-admin-only>
      <p class="nav-group-title" aria-hidden="true">管理设置</p>
      <a href="/agents"{% if section == "agents" %} aria-current="page"{% endif %} data-admin-only data-optional-column="agents" aria-label="Agent 配置">
        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <rect width="16" height="12" x="4" y="8" rx="2"/>
          <path d="M12 8V4H8M2 14h2m16 0h2m-7-1v2m-6-2v2"/>
        </svg><span class="nav-label">Agent 配置</span>
      </a>
      <a href="/audit"{% if section == "audit" %} aria-current="page"{% endif %} data-admin-only data-optional-column="audit" aria-label="日志审计">
        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg><span class="nav-label">日志审计</span>
      </a>
      <a href="/settings"{% if section == "settings" %} aria-current="page"{% endif %} data-admin-only data-optional-column="settings" aria-label="系统设置">
        <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
          <path d="M3 5h7m4-2v4m0-2h7M3 12h5m0-2v4m4-2h9M3 19h9m4-2v4m0-2h5"/>
        </svg><span class="nav-label">系统设置</span>
      </a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-tools">
        <button class="sidebar-toggle" type="button" aria-controls="workspace-nav" aria-label="收起侧栏" aria-expanded="true" hidden>
          <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <rect width="18" height="18" x="3" y="3" rx="2"/>
            <path d="M9 3v18"/>
            <path class="sidebar-toggle-chevron" d="m16 15-3-3 3-3"/>
          </svg>
        </button>
        <button class="sidebar-columns" type="button" aria-label="选择常用栏目" title="选择常用栏目" popovertarget="sidebar-visibility" hidden>
          <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M2 5h20M6 12h12M9 19h6"/></svg>
        </button>
      </div>
      <div class="sidebar-visibility" id="sidebar-visibility" popover="auto" role="region" aria-labelledby="sidebar-visibility-title" hidden>
        <h2 id="sidebar-visibility-title">常用栏目</h2>
        <label><input type="checkbox" checked disabled>提案任务</label>
        <label><input type="checkbox" data-column-choice="task-log" checked>任务明细</label>
        <label><input type="checkbox" data-column-choice="media-data" checked>数据中心</label>
        <label data-admin-only><input type="checkbox" data-column-choice="agents" checked>Agent 配置</label>
        <label data-admin-only><input type="checkbox" data-column-choice="audit" checked>日志审计</label>
        <label data-admin-only><input type="checkbox" data-column-choice="settings" checked>系统设置</label>
      </div>
      <div class="sidebar-account">
        <a class="account-link" href="/profile" aria-label="个性化设置"{% if section == "profile" %} aria-current="page"{% endif %}>
          <span class="account-avatar" data-account-avatar aria-hidden="true"><span data-account-initial>用</span><img alt="" referrerpolicy="no-referrer" hidden></span>
          <span class="account-name">个人设置</span>
        </a>
        <form class="account-exit" method="post" action="/demo/sign-out">
          <button class="logout-button" type="submit" aria-label="退出登录" title="退出登录">{% include "logout-icon.html" %}</button>
        </form>
      </div>
    </div>
  </aside>
  <div class="workspace">
    <header>
      <div class="breadcrumb"><span>工作台</span><span aria-hidden="true">/</span><strong>{{ heading }}</strong></div>
      <button class="theme-toggle" type="button" aria-label="切换深浅色" hidden>
        <svg class="theme-moon" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 15.6A8.9 8.9 0 0 1 8.4 3.6a9 9 0 1 0 12 12Z"/></svg>
        <svg class="theme-sun" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
    </header>
    <div class="workspace-scroll"><main id="main" tabindex="-1">{% block content %}{% endblock %}</main></div>
  </div>
</body>
</html>
