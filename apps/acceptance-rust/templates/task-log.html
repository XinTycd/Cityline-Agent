{% extends "shell.html" %}
{% block content %}
<div class="page-heading"><h1>{{ heading }}</h1></div>
<section class="panel filter-panel" aria-label="任务查询条件">
  <form method="get" action="/task-log" class="filter-form" role="search" aria-label="查询任务" data-workspace-submit>
    <input type="hidden" name="page_size" value="{{ pages.size }}">
    <label>任务状态<select name="filter">
      <option value="all"{% if filter == "all" %} selected{% endif %}>全部任务</option>
      <option value="approved"{% if filter == "approved" %} selected{% endif %}>已完成</option>
      <option value="active"{% if filter == "active" %} selected{% endif %}>任务中</option>
      <option value="pending"{% if filter == "pending" %} selected{% endif %}>待审核</option>
      <option value="failed"{% if filter == "failed" %} selected{% endif %}>失败</option>
      <option value="exceptions"{% if filter == "exceptions" %} selected{% endif %}>异常任务</option>
    </select></label>
    <label>关键词<span class="search-control">
      {% include "search-icon.html" %}
      <input type="search" name="q" value="{{ q }}" maxlength="100" placeholder="任务 ID、名称或日期">
    </span></label>
    <div class="action-group filter-actions">
      <button type="submit">查询</button>
      <a class="button secondary" href="/task-log?page_size={{ pages.size }}">重置</a>
    </div>
  </form>
</section>
<section class="panel list-panel" aria-label="任务查询结果">
  {% if tasks.is_empty() %}
  <p class="list-empty">没有符合条件的任务。</p>
  {% else %}
  {% let task_table_label = "任务明细列表" %}
  {% include "task-table.html" %}
  {% endif %}
  <form method="get" action="/task-log" class="list-page-form" data-workspace-submit>
    <input type="hidden" name="filter" value="{{ filter }}">
    <input type="hidden" name="q" value="{{ q }}">
    {% include "list-pages.html" %}
  </form>
</section>
{% endblock %}
