name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Rust and proposal integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          npm ci --ignore-scripts

      - name: Check Rust formatting and lint
        run: |
          cargo +stable fmt --check --manifest-path apps/acceptance-rust/Cargo.toml
          cargo +stable clippy --locked --manifest-path apps/acceptance-rust/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust and build the service
        run: |
          cargo +stable test --locked --manifest-path apps/acceptance-rust/Cargo.toml
          cargo +stable build --locked --manifest-path apps/acceptance-rust/Cargo.toml

      - name: Verify proposal APIs and HTML export
        shell: bash
        env:
          ACCEPTANCE_RUST_PORT: '3484'
        run: |
          export ACCEPTANCE_RUST_DATA="$RUNNER_TEMP/cityline-ci.sqlite"
          log="$RUNNER_TEMP/cityline-ci.log"
          apps/acceptance-rust/target/debug/hackson-acceptance >"$log" 2>&1 &
          server=$!
          trap 'status=$?; kill "$server" 2>/dev/null || true; if ((status != 0)); then cat "$log"; fi' EXIT
          curl -fsS --retry 25 --retry-connrefused --retry-delay 1 --max-time 3 \
            "http://127.0.0.1:$ACCEPTANCE_RUST_PORT/overview" > /dev/null
          node scripts/verify-media-proposals.mjs
